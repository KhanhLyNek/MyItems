name: Paper 26.3 MyItems + AgarthaLib CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-26.3-myitems-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout MyItems
        uses: actions/checkout@v4
      - name: Guard original YAML and gameplay logic
        run: python3 .github/scripts/check_legacy_logic.py
      - name: Check all skill class registrations and reviewed Venom Spread fix
        run: python3 .github/scripts/check_paper26_ability_regressions.py
      - name: Protect MyItems custom MythicMobs drops and equipment formula parity
        run: python3 .github/scripts/check_paper26_mythic_config_bridge.py
      - name: Check backward-compatible commands, abilities and YAML values
        run: python3 .github/scripts/check_legacy_contract.py

      - name: Checkout AgarthaLib
        uses: actions/checkout@v4
        with:
          repository: KhanhLyNek/AgarthaLib
          ref: master
          path: agarthalib
      - name: Validate cross-repo MythicLib ABI and removed Factions adapters
        run: python3 .github/scripts/check_paper26_mythiclib_contract.py
      - name: Guard matching Paper, PAPI, Vault and AgarthaLib coordinates
        run: python3 .github/scripts/check_dependency_alignment.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Java and Gradle versions
        run: |
          java -version
          gradle --version
      - name: Enforce modern-only NMS and plugin provider cutover in matching AgarthaLib
        run: |
          python3 agarthalib/.github/scripts/check_paper26_nms_cutover.py
          python3 agarthalib/.github/scripts/audit_paper26_legacy_bindings.py
      - name: Verify AgarthaLib PAPI expansion, live YAML callback and Vault API
        shell: bash
        run: |
          set -o pipefail
          gradle -p agarthalib testPaper26PapiOptional --no-daemon --console=plain 2>&1 | tee paper26-item-api-check.log
      - name: Verify MyItems modern placeholder adapters against matching AgarthaLib
        shell: bash
        run: |
          set -o pipefail
          gradle compilePaper26MyItemsPlaceholderBridges --no-daemon --console=plain 2>&1 | tee myitems-placeholder-bridge.log
      - name: Verify MyItems read-only optional MythicLib bridge
        shell: bash
        run: |
          set -o pipefail
          gradle compilePaper26MyItemsMythicLib --no-daemon --console=plain 2>&1 | tee myitems-mythiclib-bridge.log
      - name: Verify modern MythicMobs 5.x event ABI (isolated, no runtime activation)
        shell: bash
        run: |
          set -o pipefail
          gradle compilePaper26MythicMobsReader --no-daemon --console=plain 2>&1 | tee myitems-mythicmobs-reader.log
      - name: Verify four modern optional provider bridges in MyItems
        shell: bash
        run: |
          set -o pipefail
          gradle compilePaper26MyItemsModernProviders --no-daemon --console=plain 2>&1 | tee myitems-modern-providers.log
      - name: Validate modern AgarthaLib-to-MyItems provider method signatures
        run: python3 .github/scripts/check_paper26_modern_contract.py
      - name: Build and install AgarthaLib locally
        if: always()
        shell: bash
        run: |
          set -o pipefail
          gradle -p agarthalib clean build publishToMavenLocal --continue --no-daemon --console=plain --stacktrace 2>&1 | tee agarthalib-build-26.3.log
      - name: Build MyItems using matching AgarthaLib
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --continue --no-daemon --console=plain --stacktrace 2>&1 | tee myitems-build-26.3.log
      - name: Compile real Paper 26.3 NBT integration probe
        shell: bash
        run: |
          gradle jarPaper26LiveProbe --no-daemon --console=plain

      - name: Compile EssentialsX 2.22.0 interface fixture for real Paper integration
        shell: bash
        run: gradle jarPaper26EssentialsFixture --no-daemon --console=plain

      - name: Boot real Paper 26.3 server with both production JARs
        shell: bash
        timeout-minutes: 8
        run: |
          python3 .github/scripts/paper26_server_smoke.py

      - name: Assert production plugin JAR contents and archived API exclusions
        run: python3 .github/scripts/check_paper26_jar_contents.py
      - name: Summarize grouped compiler errors
        if: always()
        shell: bash
        run: |
          python3 agarthalib/.github/scripts/compile_report.py agarthalib-build-26.3.log myitems-build-26.3.log > compiler-report.md
          cat compiler-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Scan all Java source files in both repositories
        if: always()
        run: |
          python3 .github/scripts/audit_source_api.py > source-audit.md
          python3 agarthalib/.github/scripts/audit_source_api.py >> source-audit.md
          cat source-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myitems-and-agarthalib-build-26.3-logs
          path: |
            agarthalib-build-26.3.log
            myitems-build-26.3.log
            compiler-report.md
            source-audit.md
            paper26-item-api-check.log
            myitems-placeholder-bridge.log
            myitems-mythiclib-bridge.log
            myitems-modern-providers.log
            myitems-mythicmobs-reader.log
            paper26-server-smoke.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload test jars (not a verified release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: myitems-paper-26.3-test
          path: |
            build/libs/*.jar
            agarthalib/build/libs/*.jar
          if-no-files-found: error
