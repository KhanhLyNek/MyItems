main: com.praya.myitems.MyItems
name: LyMeowzItem
provides: [MyItems]
version: 6.4.6
api-version: 1.13
website: https://www.spigotmc.org/resources/authors/70791/
author: Praya Amadiga Pitasa
depend: 
- LyMeowzLib
softdepend:
- PlaceholderAPI
- MVdWPlaceholderAPI
- MythicMobs
- MythicLib
- AuraSkills
- MMOCore
- Lands
- DecentHolograms
- ItemsAdder
- Oraxen

commands:
  lymeowzitem:
    description: Plugin base command
    aliases: 
    - myitem
    - itemeditor
    - items
    - item
    - mi
  itematt:
    description: Show/Set all attributes of your items
    aliases: 
    - att
    - attr
    - attributes
    - attribute
  enchant:
    description: All command of enchantment
    aliases: 
    - enchantment
  enchantadd:
    description: Add enchantment to your item
    aliases: 
    - addenchant
  enchantremove:
    description: Remove an enchantment
    aliases: 
    - removeenchant
    - remenchant
  enchantclear:
    description: Remove all enchantment from your item
    aliases: 
    - clearenchant
  itemname:
    description: Set name of your item
    aliases: 
    - setdisplayname
    - setname
  lore:
    description: All command of lores edit.
    aliases: 
    - lores
  loreadd:
    description: Add new lore to your item.
    aliases: 
    - addlore
  loreset:
    description: Set lore at certain line.
    aliases: 
    - setlore
  loreinsert:
    description: Insert lore at certain line.
    aliases: 
    - insertlore
  loreremove:
    description: Remove lore at certain line.
    aliases: 
    - removelore 
    - remlore
  loreclear:
    description: Clear all lore from your item.
    aliases: 
    - clearlore
  flag:
    description: All command of flag edit.
    aliases: 
    - flags
  flagadd:
    description: Add new flag to your item.
    aliases: 
    - addflag
  flagremove:
    description: Remove flag from your item.
    aliases: 
    - removeflag
    - remflag
  flagclear:
    description: Remove all flag from your item.
    aliases: 
    - clearflag
  nbtclear:
    description: Clear all nbt from your item.
    aliases: 
    - clearnbt
  socket:
    description: Add bonus stats to equipment by applying gems.
    aliases: 
    - sockets
  unbreakable:
    description: Turn on/off unbreakable state of held item.
    aliases: 
    - unbreak
    - unbreaking
    
permissions:
  myitems.admin:
    description: Gives access to everything!
    children:
      myitems.command.reload: true
      myitems.command.save: true
      myitems.command.remove: true
      myitems.command.list: true
      myitems.command.load: true
      myitems.command.drop: true
      myitems.command.amount: true
      myitems.command.data: true
      myitems.command.material: true
      myitems.command.repair: true
      myitems.command.name: true
      myitems.command.lore: true
      myitems.command.flag: true
      myitems.command.enchant: true
      myitems.command.unbreakable: true
      myitems.command.attribute.stats: true
      myitems.command.attribute.element: true
      myitems.command.attribute.buff: true
      myitems.command.attribute.debuff: true
      myitems.command.attribute.nbt: true
      myitems.command.attribute.power: true
      myitems.command.attribute.ability: true
      myitems.command.attribute.requirement: true
      myitems.command.socket: true
      myitems.command.model: true

  myitems.command.model:
    description: Change the held item's visual model without touching MyItems gameplay metadata
    default: op

  # LyMeowz canonical permissions; the original MyItems nodes remain supported.
  lymeowzitem.admin:
    description: Administrative access to LyMeowzItem
    default: op
    children:
      lymeowzitem.command.reload: true
      lymeowzitem.command.save: true
      lymeowzitem.command.remove: true
      lymeowzitem.command.list: true
      lymeowzitem.command.load: true
      lymeowzitem.command.drop: true
      lymeowzitem.command.amount: true
      lymeowzitem.command.data: true
      lymeowzitem.command.material: true
      lymeowzitem.command.repair: true
      lymeowzitem.command.name: true
      lymeowzitem.command.lore: true
      lymeowzitem.command.flag: true
      lymeowzitem.command.enchant: true
      lymeowzitem.command.unbreakable: true
      lymeowzitem.command.attribute.stats: true
      lymeowzitem.command.attribute.element: true
      lymeowzitem.command.attribute.buff: true
      lymeowzitem.command.attribute.debuff: true
      lymeowzitem.command.attribute.nbt: true
      lymeowzitem.command.attribute.power: true
      lymeowzitem.command.attribute.ability: true
      lymeowzitem.command.attribute.requirement: true
      lymeowzitem.command.socket: true
      lymeowzitem.command.model: true

